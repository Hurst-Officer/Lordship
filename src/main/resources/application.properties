spring.application.name=Lordship
spring.profiles.active=dev

# Backup port in case 8080 is unavailable
server.port=8080

# Security: note: each increment doubles the work
security.bcrypt.strength=12
jwt.secret=${JWT_KEY}
jwt.expiration-ms=86400000

# Database - configure these as system environment variables on your machine
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Schema validation - Flyway manages all schema changes, NOT Hibernate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Lordship - configure the root_password in your environment variables
lordship.root.email=${ROOT_EMAIL}
lordship.root.password=${ROOT_PASSWORD}
lordship.encryption.algorithm=${LORDSHIP_ALGORITHM}
lordship.encryption.keys=${LORDSHIP_KEYS}

spring.aop.proxy-target-class=false

# Where generated PDFs and uploaded scans are saved. Will move to a cloud solution such as S3 later.
lordship.files.root=${LORDSHIP_FILES_ROOT:C:/Users/eman2/Downloads}

# Printed at the start of every document serial. Use may use your company's initials
lordship.serial.prefix=HS

# Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Sign-in throttle (LoginThrottle). Attempts are counted per address and per
# address + email over a fixed window; the whole server checks at most
# per-second passwords, with a small burst allowed.
lordship.login.per-second=1
lordship.login.burst=5
lordship.login.window-minutes=15
lordship.login.ip-limit=10
lordship.login.pair-limit=5
lordship.login.account-alert=20
