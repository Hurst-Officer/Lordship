# The words for every DomainProblem code, resolved at the edge against the
# request's Accept-Language. A Spanish property manager needs messages_es.properties
# beside this file and nothing else.
#
# These are MessageFormat patterns, so an apostrophe must be doubled ('') or it
# is read as a quoting mark and the arguments after it stop substituting.

# ---- lot and property gates ------------------------------------------------
lot.does_not_permit=Lot {0} does not permit {1} agreements
lot.no_longer_exists=Tenancy {0} points at a lot that no longer exists
property.no_template=This property has no terms template for {0}, so it cannot host that kind of agreement
property.no_document=This property has no document for a {1} {0}. Assign one before generating

# ---- charge term lifecycle -------------------------------------------------
term.not_editable=This term is {0} and can no longer be edited; create a new term instead
term.wrong_status=This term is {0}; only a {1} term can become {2}
term.no_instrument=This term cannot go into force: no instrument is attached, and only migrated terms are allowed to have none
term.cancel_needs_reason=A cancellation needs a reason
term.schedule_needs_a_step=A schedule needs at least one step

# ---- submission validation -------------------------------------------------
# The umbrella, followed by whichever details failed
term.not_ready_to_submit=This term is not ready to submit
term.rate_not_set=no target rate is set for {0} on this lot or on the property''s template
term.deposit_above_ceiling={0} is a multiplier, not dollars -- at a rate of {1} that is a deposit of {2}. The most months'' rent allowed is {3}
term.cars_max_below_allowed=cannot be lower than the cars allowed ({0} < {1})
term.amount_required=must be greater than zero when {0} is {1}
term.amount_must_be_zero=must be zero when {0} is {1}

# ---- patch validation ------------------------------------------------------
term.method_not_allowed=must be one of {0}
term.amount_negative=cannot be negative
term.not_a_date=must be a date as YYYY-MM-DD, not "{0}"
term.not_a_number=must be a number

# ---- document tokens -------------------------------------------------------
token.unknown=No such token: {0}
token.unknown_did_you_mean=No such token: {0} -- did you mean {1}?
token.not_a_method={0} is {1}, not a method -- nothing branches on it
token.value_omitted={0} was given no value. Omit it entirely to preview it as unset
token.value_not_allowed={0} does not take {1}. Allowed: {2}
token.row_token_misplaced={0} has no value here -- it only resolves inside a repeat over {1}
token.source.PROPERTY=This is set on the property
token.source.CHARGE_TERM=This is set on the deal
token.source.INSTRUMENT=This is set on the document itself
token.source.TENANCY=This is set on the tenancy
token.source.LOT=This is set on the lot
token.source.ORGANIZATION=This is set in global settings
token.source.HISTORY=This comes from past charge terms on the lot
token.source.COMPUTED=This is derived from other values
token.source.UNKNOWN=This token no longer exists -- the clause needs editing

# ---- clause authoring ------------------------------------------------------
clause.body_has_unknown_tokens=This clause uses tokens that do not exist
clause.values_without_field=values were given with no field to test them against
clause.field_without_values={0} was given with no values, so the clause would never print
clause.condition_not_a_method=a clause cannot be conditioned on {0}: it is {1}, and only a method can decide whether a clause prints. Conditionable tokens: {2}
clause.condition_values_not_a_list=must be a list of strings
clause.is_required=This clause is marked required. Clear the flag first if it genuinely no longer applies
clause.is_required_by_statute=This clause is marked required ({0}). Clear the flag first if it genuinely no longer applies
clause.body_has_misplaced_row_tokens=This clause uses row tokens outside the list they belong to

# ---- template and section deletes ------------------------------------------
template.still_assigned="{0}" is still assigned to at least one property. Unassign it there first, or the next lease for that park has nothing to generate from
section.is_required="{0}" is a required section. Clear its required flag first if it genuinely no longer applies
section.is_required_by_statute="{0}" is a required section ({1}). Clear its required flag first if it genuinely no longer applies

# ---- instrument authoring ------------------------------------------------------
instrument.not_editable=This document is {0}. Only a draft can be changed -- correcting paper that has gone out means a new document
instrument.cannot_be_abandoned=This document is {0}. Paper a tenant may already be holding cannot be recorded as never sent
instrument.no_term=No deal is attached to this document. Draft the charge terms first, then start the paper

assignment.already_in_use=This property already uses "{0}" for {1} {2}. Unassign that one first -- generate has to resolve to exactly one document
customization.section_not_in_document=That section is not part of {0}
customization.clause_not_in_document=That clause is not part of {0}
customization.already_excluded=This property already excludes that
customization.not_editable=This is a {0} row. There is nothing in it to edit -- remove it instead


clause.body_has_bad_markup=This clause has formatting that cannot be printed.
markup.unknown_mark=''{0}'' is not a formatting mark. The marks are <b>, <i>, <u> and <rule>.
markup.never_closed=''{0}'' is never closed.
markup.not_open=''{0}'' closes a mark that was not opened.
markup.already_open=''{0}'' is already open.
markup.rule_width_unreadable=''{0}'' does not give a width. Write it as <rule w="40">.
markup.rule_width_out_of_range=A rule of {0} characters is too wide. Use between {1} and {2}.
